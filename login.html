<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — Birdie Finder</title><link rel="stylesheet" href="assets/styles.css"></head>
<body class="auth"><main class="login-wrap"><div class="login-side"><form class="login-card" id="account-form">
  <h1 id="title">Log in</h1><p class="lsub">Use your local/test Birdie Finder account to sync solo rounds.</p>
  <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
  <div class="field" id="password-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div>
  <p id="message" role="status"></p><button class="btn-primary btn-block" type="submit" id="submit">Log in</button>
  <div class="signup-line"><button type="button" id="switch-signup">Create account</button> · <button type="button" id="switch-reset">Forgot password?</button></div>
  <div class="signup-line"><a href="catalog-live.html">Browse approved courses without an account</a></div>
</form></div></main>
<script src="assets/config.local.js"></script><script src="assets/vendor/supabase.js"></script><script src="assets/solo.js"></script>
<script>
(() => {
  const form = document.getElementById('account-form'), message = document.getElementById('message');
  const email = document.getElementById('email'), password = document.getElementById('password');
  let mode = 'login';
  function setMode(next) {
    mode = next; message.textContent = '';
    const title = { login: 'Log in', signup: 'Create account', reset: 'Reset password', newPassword: 'Choose a new password' }[mode];
    document.getElementById('title').textContent = title;
    document.getElementById('submit').textContent = title;
    email.parentElement.hidden = mode === 'newPassword';
    password.parentElement.hidden = mode === 'reset';
    password.required = mode !== 'reset'; email.required = mode !== 'newPassword';
  }
  document.getElementById('switch-signup').onclick = () => setMode(mode === 'signup' ? 'login' : 'signup');
  document.getElementById('switch-reset').onclick = () => setMode(mode === 'reset' ? 'login' : 'reset');
  try {
    const client = BFsolo.requireClient();
    client.auth.onAuthStateChange(event => { if (event === 'PASSWORD_RECOVERY') setMode('newPassword'); });
    const recovery = new URLSearchParams(location.hash.slice(1));
    if (recovery.get('type') === 'recovery' && recovery.get('access_token') && recovery.get('refresh_token')) {
      client.auth.setSession({ access_token: recovery.get('access_token'), refresh_token: recovery.get('refresh_token') })
        .then(result => { if (result.error) message.textContent = result.error.message; else setMode('newPassword'); });
    }
  } catch (error) { message.textContent = error.message; }
  form.addEventListener('submit', async event => {
    event.preventDefault(); message.textContent = 'Working…';
    try {
      const client = BFsolo.requireClient(); let result;
      if (mode === 'reset') {
        result = await client.auth.resetPasswordForEmail(email.value, { redirectTo: location.origin + location.pathname });
        if (result.error) throw result.error;
        message.textContent = 'Check your email for a password reset link.'; return;
      }
      if (mode === 'newPassword') {
        result = await client.auth.updateUser({ password: password.value });
        if (result.error) throw result.error;
        setMode('login'); message.textContent = 'Password updated.'; return;
      }
      result = mode === 'signup'
        ? await client.auth.signUp({ email: email.value, password: password.value })
        : await client.auth.signInWithPassword({ email: email.value, password: password.value });
      if (result.error) throw result.error;
      if (!result.data.session) { message.textContent = 'Check your email to confirm your account, then log in.'; return; }
      await BFsolo.bootstrap();
      const next = new URLSearchParams(location.search).get('next');
      location.href = ['scorecard.html', 'players.html'].includes(next) ? next : 'scorecard.html';
    } catch (error) { message.textContent = error.message; }
  });
})();
</script></body></html>
