<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your rounds — Birdie Finder</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><main class="page"><div class="sc-wrap" style="padding:36px 16px">
  <a class="crumb" href="index.html">← Home</a><h1 class="page-title">Your rounds</h1>
  <p id="account"></p><p id="message" role="status"></p>
  <p><a class="btn-primary" href="scorecard.html">Start a solo round</a> · <a href="import.html">Review old browser rounds</a></p>
  <div class="sc-card" id="rounds"></div>
  <div class="sc-card" style="margin-top:16px"><h2>My approved disc bag</h2><div id="bag"></div></div>
  <p><button type="button" id="export-account">Export account data</button> <button type="button" id="delete-account">Delete account</button></p>
  <button type="button" id="signout" hidden>Sign out</button>
</div></main>
<script src="assets/config.local.js"></script><script src="assets/vendor/supabase.js"></script><script src="assets/solo.js"></script>
<script>
(() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  async function init() {
    try {
      const user = await BFsolo.requireUser();
      document.getElementById('account').textContent = user.email;
      const rounds = await BFsolo.listRounds();
      document.getElementById('rounds').innerHTML = rounds.length
        ? rounds.map(round => `<p><a href="scorecard.html?round=${encodeURIComponent(round.id)}">${esc(round.layout_name)} · ${new Date(round.started_at).toLocaleDateString()} · ${esc(round.status)}</a></p>`).join('')
        : '<p>No saved rounds yet.</p>';
      const bag = await BFsolo.client.from('bag_items').select('id,disc_mold_id').order('added_at');
      if (bag.error) throw bag.error;
      const moldIds = bag.data.map(item => item.disc_mold_id);
      const molds = moldIds.length ? await BFsolo.client.from('disc_molds').select('id,name,manufacturer').in('id',moldIds) : {data:[]};
      if (molds.error) throw molds.error;
      const byId = new Map(molds.data.map(d => [d.id,d]));
      document.getElementById('bag').innerHTML = bag.data.length ? bag.data.map(item => {
        const d = byId.get(item.disc_mold_id);
        return `<p>${esc(d?.manufacturer || 'Unknown')} ${esc(d?.name || 'mold')} <button data-remove="${esc(item.id)}">Remove</button></p>`;
      }).join('') : '<p>No approved discs in your account bag.</p>';
      document.querySelectorAll('[data-remove]').forEach(button => button.onclick = async () => {
        const result = await BFsolo.client.from('bag_items').delete().eq('id',button.dataset.remove);
        if (result.error) document.getElementById('message').textContent = result.error.message;
        else void init();
      });
      document.getElementById('export-account').onclick = async () => {
        const result = await BFsolo.client.rpc('export_account_v1');
        if (result.error) { document.getElementById('message').textContent = result.error.message; return; }
        const bundle = {account:result.data,local_legacy_rounds:
          localStorage.getItem('bf_legacy_claim_owner_v1') === user.id ? localStorage.getItem('bf_rounds_v1') : null};
        const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}));
        link.download = 'birdie-finder-account.json'; link.click(); setTimeout(() => URL.revokeObjectURL(link.href),1000);
      };
      document.getElementById('delete-account').onclick = async () => {
        if (prompt('Type DELETE MY BIRDIE FINDER ACCOUNT to remove your account and synced data:') !== 'DELETE MY BIRDIE FINDER ACCOUNT') return;
        const result = await BFsolo.client.rpc('delete_account_v1',{p_confirmation:'DELETE MY BIRDIE FINDER ACCOUNT'});
        if (result.error) { document.getElementById('message').textContent = result.error.message; return; }
        await BFsolo.client.auth.signOut(); location.href = 'login.html';
      };
      const signout = document.getElementById('signout'); signout.hidden = false;
      signout.onclick = async () => { await BFsolo.client.auth.signOut(); location.href = 'login.html'; };
    } catch (error) {
      document.getElementById('message').textContent = error.message;
      document.getElementById('rounds').innerHTML = '<a href="login.html?next=players.html">Log in or create an account</a>';
    }
  }
  init();
})();
</script></body></html>
