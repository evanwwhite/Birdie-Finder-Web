<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo scorecard — Birdie Finder</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><main class="page"><div class="sc-wrap" style="padding:36px 16px">
  <a class="crumb" href="catalog-live.html">← Courses</a><h1 class="page-title">Solo scorecard</h1>
  <p>An internet connection is required to save from the browser. Missing scores and unknown par stay blank.</p>
  <p id="account"></p><p id="message" role="status"></p>
  <section class="sc-card"><h2>New round</h2><div id="courses"></div></section>
  <section class="sc-card" style="margin-top:18px"><h2>Your saved rounds</h2><div id="rounds"></div></section>
  <section class="sc-card" style="margin-top:18px" id="current" hidden><div id="scorecard"></div></section>
</div></main>
<script src="assets/config.local.js"></script><script src="assets/vendor/supabase.js"></script><script src="assets/solo.js"></script>
<script>
(() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const $ = id => document.getElementById(id);
  const message = text => { $('message').textContent = text; };
  let current = null;
  async function showRound(id) {
    current = await BFsolo.round(id);
    history.replaceState(null, '', '?round=' + encodeURIComponent(id));
    const r = current;
    const scored = r.holes.filter(h => h.strokes != null).length;
    const total = r.holes.reduce((sum, h) => sum + (h.strokes ?? 0), 0);
    const knownPar = r.holes.every(h => h.par != null);
    const parTotal = knownPar ? r.holes.reduce((sum, h) => sum + h.par, 0) : null;
    $('current').hidden = false;
    $('scorecard').innerHTML = `<h2>${esc(r.layout_name)} · ${esc(r.status)}</h2>
      <p>${scored}/${r.holes.length} scored · ${scored ? total : '—'} strokes · ${parTotal == null ? 'Par unknown' : 'Par ' + parTotal} · Revision ${r.revision}</p>
      <div class="sc-grid-wrap"><table class="sc-grid"><thead><tr><th>Hole</th><th>Par</th><th>Distance</th><th>Strokes</th><th>Save</th></tr></thead><tbody>
      ${r.holes.map(h => `<tr><td>${h.hole_number}</td><td>${h.par ?? '—'}</td><td>${h.distance_ft == null ? '—' : h.distance_ft + ' ft'}</td>
      <td><input type="number" min="1" max="12" step="1" value="${h.strokes ?? ''}" aria-label="Hole ${h.hole_number} strokes" data-score="${h.hole_number}"></td>
      <td><button type="button" data-save="${h.hole_number}">Save score</button></td></tr>`).join('')}
      </tbody></table></div><div class="sc-navrow"><button type="button" id="refresh">Refresh from server</button>
      ${r.status === 'live' ? '<button type="button" id="finish"' + (scored === r.holes.length ? '' : ' disabled') + '>Finish round</button>' : ''}</div>`;
    $('scorecard').querySelectorAll('[data-save]').forEach(button => button.onclick = async () => {
      const hole = Number(button.dataset.save);
      const input = $('scorecard').querySelector(`[data-score="${hole}"]`);
      const strokes = Number(input.value);
      if (!Number.isInteger(strokes) || strokes < 1 || strokes > 12) { message('Enter an integer from 1 to 12.'); return; }
      button.disabled = true;
      try { await BFsolo.score(current, hole, strokes); message('Score saved to account.'); await showRound(id); await listRounds(); }
      catch (error) { message(error.message + ' Refresh from server before editing again.'); button.disabled = false; }
    });
    $('refresh').onclick = () => showRound(id).then(() => message('Loaded current server scores.')).catch(error => message(error.message));
    if ($('finish')) $('finish').onclick = async () => {
      try { await BFsolo.complete(current); await showRound(id); await listRounds(); message('Round complete.'); }
      catch (error) { message(error.message); }
    };
  }
  async function listRounds() {
    const rounds = await BFsolo.listRounds();
    $('rounds').innerHTML = rounds.length ? rounds.map(r => `<p><button type="button" data-round="${esc(r.id)}">${esc(r.layout_name)} · ${new Date(r.started_at).toLocaleDateString()} · ${esc(r.status)}</button></p>`).join('') : '<p>No account rounds yet.</p>';
    $('rounds').querySelectorAll('[data-round]').forEach(button => button.onclick = () => showRound(button.dataset.round).catch(error => message(error.message)));
  }
  async function init() {
    try {
      const user = await BFsolo.requireUser();
      $('account').textContent = `Signed in as ${user.email}`;
      const courses = await BFsolo.courses();
      $('courses').innerHTML = courses.length ? courses.map((course, i) => `<p><button type="button" data-course="${i}">Start ${esc(course.name)} · ${course.holes.length} holes</button> · ${esc(course.layout)}</p>`).join('') : '<p>No approved playable courses are available yet.</p>';
      $('courses').querySelectorAll('[data-course]').forEach(button => button.onclick = async () => {
        button.disabled = true;
        try { const round = await BFsolo.create(courses[Number(button.dataset.course)]); await listRounds(); await showRound(round.id); message('Round saved to account.'); }
        catch (error) { message(error.message); } finally { button.disabled = false; }
      });
      await listRounds();
      const id = new URLSearchParams(location.search).get('round');
      if (id) await showRound(id);
    } catch (error) {
      message(error.message);
      $('account').innerHTML = '<a href="login.html?next=scorecard.html">Log in or create an account</a>';
    }
  }
  init();
})();
</script></body></html>
